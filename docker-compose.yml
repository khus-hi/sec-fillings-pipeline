# Local S3: MinIO speaks the S3 API, so boto3 code written for AWS works unchanged.
#   docker compose up -d          start it
#   open http://localhost:9001    web console (minioadmin / minioadmin)
#   docker compose down           stop it (data survives in the minio-data volume)
services:
  minio:
    # MinIO stopped publishing new Docker Hub images in late 2025, so "latest" is frozen.
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]  # mc ships inside the minio image
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot helper: creates the sec-raw bucket once MinIO is healthy, then exits.
  create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/sec-raw
      "

volumes:
  minio-data:
